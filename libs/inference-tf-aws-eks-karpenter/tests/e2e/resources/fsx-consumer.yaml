# A minimal consumer pod that mounts the FSx-backed /models PVC RWX (the PVC's own
# accessModes) and does two things:
#   1) DRA-visibility check — polls for a pre-seeded probe file the test put at
#      s3://<model_store>/models/${probe_dir}/probe.txt (auto_import events =
#      [NEW, CHANGED] pull it into Lustre) and asserts the content matches
#      ${probe_content}. This proves S3 → Lustre → pod alignment at the documented
#      path — a regression to DRA file_system_path="/models" would surface the
#      file at /models/models/${probe_dir}/probe.txt and fail this assertion.
#   2) POSIX read/write round-trip on a scratch file (the auto_export policy is
#      empty, so the write never propagates back to S3 — safe for E2E).
# Pinned to the FSx AZ (single-AZ file system) via topology.kubernetes.io/zone
# nodeAffinity. Runs on the default Karpenter CPU NodePool.
#
# Substitutions:
#   ${image}          — busybox via pull-through
#   ${namespace}      — workload namespace (from Terraform output)
#   ${claim_name}     — FSx PVC name (from the storage chart: fsx.claimName)
#   ${zone}           — FSx AZ (from Terraform output fsx_availability_zone)
#   ${probe_dir}      — per-run unique subdir under models/ (pod expects it at /models/${probe_dir})
#   ${probe_content}  — expected content of ${probe_dir}/probe.txt (the test wrote it)
apiVersion: v1
kind: Pod
metadata:
  name: fsx-consumer-e2e
  namespace: ${namespace}
  labels:
    app: fsx-consumer-e2e
spec:
  restartPolicy: Never
  # Pods must land in the FSx AZ or every mount pays inter-AZ traffic + latency.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values: ["${zone}"]
  containers:
    - name: shell
      image: ${image}
      command: ["sh", "-c"]
      # Prove the mount is present + writeable at the Lustre layer (the PVC is RWX; the
      # mountPath is left rw so the assertion can also touch a scratch file). The DRA's
      # auto_export_policy is empty, so writes never propagate back to S3 — safe for E2E.
      # No shell command substitutions and no bare dollar-vars in the script below:
      # every dollar sign would be interpreted as a placeholder by python string.Template
      # in apply_resource(), and the render errors before this pod even applies.
      args:
        - |
          set -eu
          echo "[fsx-consumer] uname -a:"; uname -a
          echo "[fsx-consumer] /models mount info:"
          mount | grep -E "on /models" || (echo "no /models mount" >&2; exit 1)

          # --- DRA-visibility probe ---
          # The test seeded s3://<model_store>/models/${probe_dir}/probe.txt with
          # ${probe_content} before applying this pod. DRA auto_import propagates
          # new S3 objects into Lustre within seconds; poll until the file appears
          # at the DOCUMENTED path /models/${probe_dir}/probe.txt (not one level
          # deeper — a broken DRA file_system_path would put it at
          # /models/models/${probe_dir}/probe.txt and this loop would time out).
          # `$$` escapes for python string.Template — shell reads it as a literal dollar sign.
          probe_path=/models/${probe_dir}/probe.txt
          echo "[fsx-consumer] waiting for DRA to surface $$probe_path"
          i=1
          while [ "$$i" -le 60 ]; do
            if [ -f "$$probe_path" ]; then
              echo "[fsx-consumer] probe file appeared after $$i polls"
              break
            fi
            if [ "$$i" = "60" ]; then
              echo "[fsx-consumer] FAIL: DRA never surfaced $$probe_path in ~180s" >&2
              echo "[fsx-consumer] (regression to nested /models/models layout?)" >&2
              ls -la /models/${probe_dir}/ 2>&1 || true
              ls -la /models/ 2>&1 || true
              exit 1
            fi
            sleep 3
            i=$$((i + 1))
          done
          actual=$$(cat "$$probe_path")
          if [ "$$actual" != "${probe_content}" ]; then
            echo "[fsx-consumer] FAIL: probe content mismatch — expected ${probe_content}" >&2
            exit 1
          fi
          echo "[fsx-consumer] DRA content check OK"

          # --- POSIX RWX round-trip ---
          echo "[fsx-consumer] writing scratch file..."
          echo "hello-fsx-write-check" > /models/.e2e-write-check
          echo "[fsx-consumer] reading it back:"
          cat /models/.e2e-write-check
          rm -f /models/.e2e-write-check
          echo "[fsx-consumer] OK"
      volumeMounts:
        - name: models
          mountPath: /models
  volumes:
    - name: models
      persistentVolumeClaim:
        claimName: ${claim_name}
